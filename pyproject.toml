[tool.poetry]
name = "analystkit"
version = "0.5.0"
description = "Bitwise brand theme, chart utilities, and export helpers for Plotly."
authors = ["Josh Carlisle <josh@bitwiseinvestments.com>"]
readme = "README.md"
packages = [{ include = "analystkit" }]

[tool.poetry.dependencies]
python = "^3.8"
plotly = ">=6.1.1"
pandas = "^2.0.0"
numpy = ">=1.21"

# Static image export (svg, png, pdf, etc.)
# Install manually if needed: pip install kaleido
kaleido = { version = "^1.1.0", optional = true }

[tool.poetry.extras]
export = ["kaleido"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
